<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <style>
        :root {
            --bg-page: #f2f4f7;
            --bg-panel: #ffffff;
            --bg-stage: #ffffff;
            --border-subtle: #d0d7de;
            --text-primary: #1f2328;
            --text-muted: #57606a;
            --focus-ring: #2563eb;
            --button-bg: #fef3c7;
            --button-hover: #f59e0b;
            --status-info: #0f172a;
            --status-loading: #1d4ed8;
            --status-success: #065f46;
            --status-error: #b91c1c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--bg-page);
            color: var(--text-primary);
            font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
        }

        .app-shell {
            max-width: 1360px;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 24px);
            display: grid;
            gap: clamp(12px, 2vw, 20px);
        }

        .control-panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: clamp(12px, 2vw, 18px);
            display: grid;
            gap: 14px;
        }

        .control-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-field {
            display: grid;
            gap: 6px;
        }

        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .custom-select {
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            font-size: clamp(16px, 1.6vw, 20px);
            padding: 0.45em 0.7em;
            min-width: 9em;
            background: #fff;
            color: var(--text-primary);
        }

        .date-label {
            margin: 0;
            min-width: 12em;
            font-size: clamp(16px, 2.1vw, 24px);
            font-weight: 700;
        }

        #time_slider {
            width: min(100%, 980px);
            height: 18px;
            cursor: pointer;
        }

        #time_slider:focus-visible,
        button:focus-visible,
        select:focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .status-message {
            margin: 0;
            font-size: 14px;
            min-height: 1.3em;
            color: var(--status-info);
            flex: 1 1 250px;
            text-align: right;
        }

        .status-message[data-type="loading"] {
            color: var(--status-loading);
        }

        .status-message[data-type="success"] {
            color: var(--status-success);
        }

        .status-message[data-type="error"] {
            color: var(--status-error);
            font-weight: 700;
        }

        .control-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .control-group {
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 10px;
            background: #f8fafc;
            min-height: 100%;
        }

        .group-title {
            margin: 0 0 8px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .button-group.vertical {
            display: grid;
            gap: 8px;
        }

        .control-button,
        .filter-button {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 9px 10px;
            font-size: clamp(14px, 1.5vw, 18px);
            line-height: 1.1;
            cursor: pointer;
            transition: background-color 120ms ease-in-out, transform 80ms ease-in-out;
        }

        .control-button {
            background-color: var(--button-bg);
            color: var(--text-primary);
            min-width: 96px;
        }

        .control-button:hover {
            background-color: var(--button-hover);
        }

        .control-button.is-active {
            border-color: #1d4ed8;
            box-shadow: 0 0 0 1px #1d4ed8;
        }

        .control-button:active,
        .filter-button:active {
            transform: scale(0.98);
        }

        .filter-button {
            color: #fff;
            font-weight: 700;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
        }

        .stage {
            width: 100%;
            height: auto;
            background-color: var(--bg-stage);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
        }

        #loading {
            width: 100%;
            height: 100%;
            transition: opacity 300ms ease;
            background-color: rgba(240, 248, 255, 0.6);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;
        }

        .spinner {
            width: 120px;
            height: 120px;
            margin: min(30vh, 280px) auto;
            background-color: #fff;
            border-radius: 100%;
            animation: sk-scaleout 1s infinite ease-in-out;
        }

        .loaded {
            opacity: 0;
            visibility: hidden;
        }

        @keyframes sk-scaleout {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        @media (max-width: 1024px) {
            .control-grid {
                grid-template-columns: 1fr;
            }

            .status-message {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="control-panel">
            <div class="control-row">
                <div class="control-field">
                    <label for="date1" class="field-label">日付</label>
                    <select id="date1" class="custom-select" name="date1"></select>
                </div>
                <p id="status_message" class="status-message" data-type="" aria-live="polite"></p>
            </div>

            <div class="control-row">
                <p id="date_time_label" class="date-label"></p>
                <input type="range" id="time_slider" value="0" min="0" step="1" />
            </div>

            <div class="control-grid">
                <section class="control-group" aria-label="再生コントロール">
                    <h2 class="group-title">再生</h2>
                    <div class="button-group">
                        <button id="btn_prev_30min" class="control-button" type="button">30分戻る</button>
                        <button id="btn_rewind" class="control-button" type="button">◀︎</button>
                        <button id="btn_pause" class="control-button" type="button">◼︎</button>
                        <button id="btn_play" class="control-button" type="button">▶︎</button>
                        <button id="btn_next_30min" class="control-button" type="button">30分進む</button>
                    </div>
                </section>

                <section class="control-group" aria-label="勤務帯フィルタ">
                    <h2 class="group-title">勤務帯</h2>
                    <div id="work_filter_controls" class="button-group vertical"></div>
                </section>

                <section class="control-group" aria-label="レベルフィルタ">
                    <h2 class="group-title">レベル</h2>
                    <div id="level_filter_controls" class="button-group vertical"></div>
                </section>
            </div>
        </header>

        <svg class="stage"></svg>
    </div>

    <div id="loading" class="loaded">
        <div class="spinner"></div>
    </div>

    <script src="d3.js"></script>
    <script src="./scripts/filter_constants.js"></script>
    <script src="./scripts/main_app.js"></script>
</body>
</html>
